name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64

      - name: Flutter pub get
        run: flutter pub get

      - name: Prepare CocoaPods
        shell: bash
        run: |
          cd ios
          pod deintegrate
          rm -rf Pods Podfile.lock
          pod install

      # --------------------------------------------------------
      # FIX: Use Ruby to programmatically disable signing
      # --------------------------------------------------------
      - name: Disable Code Signing (Ruby Method)
        run: |
          gem install xcodeproj
          ruby -e '
            require "xcodeproj"
            project_path = "ios/Runner.xcodeproj"
            project = Xcodeproj::Project.open(project_path)
            
            # Iterate over every target (Runner, Tests, etc)
            project.targets.each do |target|
              target.build_configurations.each do |config|
                # Forcefully disable all signing checks
                config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
                config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
                config.build_settings["CODE_SIGN_IDENTITY"] = ""
                config.build_settings["EXPANDED_CODE_SIGN_IDENTITY"] = ""
                config.build_settings["DEVELOPMENT_TEAM"] = ""
              end
            end
            project.save
          '

      - name: Build iOS (no codesign)
        # We add --no-pub to prevent Flutter from overwriting our CocoaPods/Project changes
        run: flutter build ipa --release --export-method development --no-codesign --no-pub

      - name: Upload IPA to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ios/ipa/*.ipa
          tag: v1.0
          overwrite: true
          body: "This is first release"