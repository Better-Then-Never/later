name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64

      - name: Flutter pub get
        run: flutter pub get

      - name: Prepare CocoaPods
        shell: bash
        run: |
          cd ios
          pod deintegrate
          rm -rf Pods Podfile.lock
          pod install

      # --------------------------------------------------------
      # FIX STARTS HERE: Disable Signing in Xcode Project
      # --------------------------------------------------------
      - name: Disable Code Signing in Xcode Project
        run: |
          cd ios/Runner.xcodeproj
          # 1. Switch from "Automatic" to "Manual" signing
          sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' project.pbxproj
          # 2. Remove the Team ID if present
          sed -i '' 's/DevelopmentTeam = .*/DevelopmentTeam = "";/g' project.pbxproj
          # 3. Force Code Signing Identity to empty
          sed -i '' 's/CODE_SIGN_IDENTITY = .*/CODE_SIGN_IDENTITY = "";/g' project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "";/g' project.pbxproj
          # 4. Explicitly tell Xcode not to require signing
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' project.pbxproj
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES;/CODE_SIGNING_ALLOWED = NO;/g' project.pbxproj

      - name: Build iOS (no codesign)
        # Note: Added "--export-options-plist=null" workaround is sometimes needed,
        # but usually the sed commands above are enough.
        run: flutter build ipa --release --export-method development --no-codesign

      - name: Upload IPA to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ios/ipa/*.ipa
          tag: v1.0
          overwrite: true
          body: "This is first release"
