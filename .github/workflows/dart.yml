name: iOS-ipa-build

# Manual unsigned iOS build published as GitHub release v0.0.<run number>.
# Required secrets: docs/CI.md.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: iOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Pinned to the version the app is tested with; 'stable' moves on its own.
          flutter-version: '3.38.4'
          architecture: x64

      - run: flutter pub get

      - name: Write Firebase config
        env:
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          MAPS_API_KEY_IOS: ${{ secrets.MAPS_API_KEY_IOS }}
        run: bash tools/ci/write-config.sh ios

      - run: pod repo update
        working-directory: ios

      - name: Build iOS
        run: flutter build ios --release --no-codesign --build-name=0.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - run: mkdir Payload
        working-directory: build/ios/iphoneos

      - run: mv Runner.app/ Payload
        working-directory: build/ios/iphoneos

      - name: Zip output
        run: zip -qq -r -9 FlutterIpaExport.ipa Payload
        working-directory: build/ios/iphoneos

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ios/iphoneos/FlutterIpaExport.ipa
          tag: v0.0.${{ github.run_number }}
          release_name: "Release v0.0.${{ github.run_number }}"
          overwrite: true
          body: "Automatic build version 0.0.${{ github.run_number }}"
