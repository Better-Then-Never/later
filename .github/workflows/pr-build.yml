name: PR build check

# Builds Android and iOS like release.yml, for every pull request into main,
# so a merge cannot break the release. Publishes nothing; the APK is kept as a
# run artifact for testing. Required secrets: docs/CI.md.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Analyze, test, design tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Same version as release.yml.
          flutter-version: '3.38.4'
          architecture: x64

      - run: flutter pub get

      - name: Write Firebase config
        env:
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: bash tools/ci/write-config.sh android

      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      # Goldens are recorded on Windows; Linux rasterises the font slightly
      # differently, so they are compared locally only.
      - run: flutter test --exclude-tags golden
      - name: Design tokens
        run: dart run tool/check_design_tokens.dart

  build-android:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Same version as release.yml.
          flutter-version: '3.38.4'
          architecture: x64

      - run: flutter pub get

      - name: Write Firebase config
        env:
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: bash tools/ci/write-config.sh android

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build APK
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY_ANDROID }}
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Keep the APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-pr-${{ github.event.pull_request.number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  build-ios:
    name: iOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Same version as release.yml.
          flutter-version: '3.38.4'
          architecture: x64

      - run: flutter pub get

      - name: Write Firebase config
        env:
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          MAPS_API_KEY_IOS: ${{ secrets.MAPS_API_KEY_IOS }}
        run: bash tools/ci/write-config.sh ios

      - run: pod repo update
        working-directory: ios

      - name: Build iOS
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
