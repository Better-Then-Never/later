name: Build & Release (iOS + Android)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --build-name=0.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: iOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - run: flutter pub get

      - run: pod repo update
        working-directory: ios

      - name: Build iOS
        run: flutter build ios --release --no-codesign --build-name=0.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Create IPA
        working-directory: build/ios/iphoneos
        run: |
          mkdir Payload
          mv Runner.app/ Payload
          zip -qq -r -9 FlutterIpaExport.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/iphoneos/FlutterIpaExport.ipa

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: artifacts/ios

      - name: Upload APK to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: artifacts/android/app-release.apk
          asset_name: app-release-v0.0.${{ github.run_number }}.apk
          tag: v0.0.${{ github.run_number }}
          release_name: "Release v0.0.${{ github.run_number }}"
          overwrite: true
          body: "Automatic build version 0.0.${{ github.run_number }}"

      - name: Upload IPA to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: artifacts/ios/FlutterIpaExport.ipa
          asset_name: FlutterIpaExport-v0.0.${{ github.run_number }}.ipa
          tag: v0.0.${{ github.run_number }}
          release_name: "Release v0.0.${{ github.run_number }}"
          overwrite: true
          body: "Automatic build version 0.0.${{ github.run_number }}"
