name: later
description: "Time capsule app"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.3.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  firebase_messaging: 16.1.0
  google_sign_in: ^6.1.5

  # State management
  provider: ^6.1.5

  # Maps and location
  google_maps_flutter: ^2.12.3
  # Pinned to align iOS GoogleUtilities with MLKit (mobile_scanner) in CocoaPods.
  google_maps_flutter_ios: ^2.15.7
  custom_info_window: ^1.0.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  location: ^8.0.1

  # Media
  camera: ^0.11.2
  image_picker: ^1.1.2
  image: ^4.0.0
  # Upgraded to resolve a CocoaPods conflict (aligns GoogleMLKit with GoogleUtilities 8.x).
  mobile_scanner: ^7.1.4
  qr_flutter: ^4.1.0

  # Platform services
  flutter_local_notifications: ^19.5.0
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.3
  share_plus: ^12.0.1

  # UI and utilities
  page_transition: ^2.2.1
  snow_fall_animation: ^0.0.1+3
  intl: ^0.20.2
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/later_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/icons/navbar/
    - assets/images/icons/login_signup_pages/
    - assets/images/icons/prof_page/
    - assets/images/icons/camera/
    - assets/images/icons/map/pins/
    - assets/images/icons/capsule_creation/
    - assets/images/icons/history_page/
    - assets/images/icons/friends_page/
    - assets/gifs/loading/

  fonts:
    - family: Irina
      fonts:
        - asset: assets/fonts/IrinaSans/InriaSans-Regular.ttf
        - asset: assets/fonts/IrinaSans/InriaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/IrinaSans/InriaSans-Italic.ttf
          style: italic
