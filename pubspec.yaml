name: later
description: "Time capsule app"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  # Localization (lib/l10n, built from tool/l10n/fragments).
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^4.3.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  firebase_messaging: 16.1.0
  google_sign_in: ^6.1.5

  # State management
  provider: ^6.1.5

  # Maps and location
  google_maps_flutter: ^2.12.3
  # Pinned to align iOS GoogleUtilities with MLKit (mobile_scanner) in CocoaPods.
  google_maps_flutter_ios: ^2.15.7
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # Media
  camera: ^0.11.2
  image_picker: ^1.1.2
  image: ^4.0.0
  # Upgraded to resolve a CocoaPods conflict (aligns GoogleMLKit with GoogleUtilities 8.x).
  mobile_scanner: ^7.1.4
  qr_flutter: ^4.1.0

  # Platform services
  flutter_local_notifications: ^19.5.0
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.3
  share_plus: ^12.0.1
  # Settings: help, support email and legal links; app version; cache size.
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.1
  path_provider: ^2.1.6

  # UI and utilities
  snow_fall_animation: ^0.0.1+3
  intl: ^0.20.2
  collection: ^1.19.1
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Performance and flow tests on a device (integration_test/, test_driver/).
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  fake_cloud_firestore: ^4.1.0+1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/later_logo.png"

flutter:
  uses-material-design: true
  # AppLocalizations from lib/l10n/app_*.arb (l10n.yaml).
  generate: true

  # Typed accessors: lib/core/assets/app_assets.dart
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/auth/
    - assets/icons/camera/
    - assets/icons/capsule/
    - assets/icons/friends/
    - assets/icons/history/
    - assets/icons/map/
    - assets/icons/messages/
    - assets/icons/navbar/
    - assets/icons/profile/
    # Dark-theme variants (tool/make_dark_icons.dart), served by ThemedAssetBundle.
    - assets/icons_dark/auth/
    - assets/icons_dark/camera/
    - assets/icons_dark/capsule/
    - assets/icons_dark/friends/
    - assets/icons_dark/history/
    - assets/icons_dark/map/
    - assets/icons_dark/messages/
    - assets/icons_dark/navbar/
    - assets/icons_dark/profile/

  # Inria Sans, registered under the family name "Irina" used throughout the app.
  fonts:
    - family: Irina
      fonts:
        - asset: assets/fonts/inria_sans/InriaSans-Regular.ttf
        - asset: assets/fonts/inria_sans/InriaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/inria_sans/InriaSans-Italic.ttf
          style: italic
