<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join me on Later!</title>
    <link rel="icon" type="image/x-icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📱</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inria+Sans:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inria Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #2196f3 0%, #56c92e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 24px;
            padding: 48px 40px;
            text-align: center;
            box-shadow: 0 32px 64px rgba(33, 150, 243, 0.2);
            max-width: 420px;
            width: 100%;
            position: relative;
        }

        .logo {
            width: 88px;
            height: 88px;
            background: linear-gradient(135deg, #2196f3, #56c92e);
            border-radius: 50%;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 36px;
            font-weight: 900;
            box-shadow: 0 8px 32px rgba(33, 150, 243, 0.3);
        }

        .user-info {
            background: linear-gradient(135deg, #e3f2fd, #e8f5e8);
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 32px;
            border: 1px solid #bbdefb;
        }

        .user-name {
            font-size: 24px;
            font-weight: 700;
            color: black;
            margin-bottom: 8px;
        }

        .user-subtitle {
            color: black;
            font-size: 16px;
            font-weight: 500;
        }

        h1 {
            color: #1565c0;
            margin-bottom: 12px;
            font-size: 32px;
            font-weight: 800;
        }

        .subtitle {
            color: #424242;
            margin-bottom: 36px;
            line-height: 1.6;
            font-size: 16px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .store-buttons {
            display: flex;
            flex-direction: row;
            gap: 12px;
            justify-content: center;
        }

        .store-buttons .btn-secondary {
            flex: 1;
            min-width: 0;
        }

        .btn {
            padding: 16px 24px;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #2196f3, #56c92e);
            color: white;
            box-shadow: 0 8px 32px rgba(33, 150, 243, 0.3);
            height: 56px;
            font-size: 18px;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #1976d2, #43a047);
            box-shadow: 0 12px 48px rgba(33, 150, 243, 0.4);
        }

        .btn-secondary {
            background: #000000;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px 20px;
            font-size: 14px;
            font-weight: 600;
            height: 56px;
            justify-content: flex-start;
            text-align: left;
        }

        .btn-secondary:hover {
            background: #333333;
            color: white;
        }

        .store-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 1.2;
        }

        .store-text-small {
            font-size: 10px;
            font-weight: 400;
            opacity: 0.8;
        }

        .store-text-main {
            font-size: 16px;
            font-weight: 600;
        }

        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            display: none;
        }

        .status.show {
            display: block;
        }

        .status.success {
            background: #e8f5e8;
            color: #2e7d32;
            border: 1px solid #56c92e;
        }

        .status.info {
            background: #e3f2fd;
            color: #1565c0;
            border: 1px solid #2196f3;
        }

        @media (max-width: 480px) {
            .container {
                padding: 32px 24px;
                margin: 16px;
            }

            h1 {
                font-size: 28px;
            }

            .user-name {
                font-size: 20px;
            }

            .store-buttons {
                flex-direction: row;
            }

            .btn-secondary {
                padding: 12px 16px;
            }

            .store-text-main {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo" id="userAvatar">L</div>

        <div class="user-info">
            <div class="user-name" id="userName">Loading...</div>
            <div class="user-subtitle">wants to connect with you on Later!</div>
        </div>

        <h1>Join Later</h1>
        <p class="subtitle">Connect with friends and share moments that matter. Join the community!</p>

        <div class="buttons">
            <button class="btn btn-primary" id="openAppBtn">
                📱 Open Later App
            </button>
            <div class="store-buttons">
                <a href="https://play.google.com/store/apps/details?id=com.example.later" class="btn btn-secondary"
                    target="_blank">
                    <svg width="24" height="24" viewBox="0 0 24 24" style="margin-right: 12px;">
                        <path d="M3 20.5V3.5C3 2.91 3.34 2.39 3.84 2.15L13.69 12L3.84 21.85C3.34 21.61 3 21.09 3 20.5Z"
                            fill="#4285f4" />
                        <path d="M16.81 15.12L6.05 21.34L14.54 12.85L16.81 15.12Z" fill="#ea4335" />
                        <path
                            d="M20.16 10.81C20.5 11.08 20.75 11.5 20.75 12C20.75 12.5 20.53 12.9 20.18 13.18L17.89 14.5L15.39 12L17.89 9.5L20.16 10.81Z"
                            fill="#FBBC04" />
                        <path d="M6.05 2.66L16.81 8.88L14.54 11.15L6.05 2.66Z" fill="#34a853" />
                    </svg>
                    <div class="store-text">
                        <div class="store-text-small">GET IT ON</div>
                        <div class="store-text-main">Google Play</div>
                    </div>
                </a>
                <a href="https://apps.apple.com/app/later/id123456789" class="btn btn-secondary" target="_blank">
                    <svg width="24" height="24" viewBox="0 0 24 24" style="margin-right: 12px;" fill="white">
                        <path
                            d="M18.71,19.5C17.88,20.74 17,21.95 15.66,21.97C14.32,22 13.89,21.18 12.37,21.18C10.84,21.18 10.37,21.95 9.1,22C7.79,22.05 6.8,20.68 5.96,19.47C4.25,17 2.94,12.45 4.7,9.39C5.57,7.87 7.13,6.91 8.82,6.88C10.1,6.86 11.32,7.75 12.11,7.75C12.89,7.75 14.37,6.68 15.92,6.84C16.57,6.87 18.39,7.1 19.56,8.82C19.47,8.88 17.39,10.1 17.41,12.63C17.44,15.65 20.06,16.66 20.09,16.67C20.06,16.74 19.67,18.11 18.71,19.5M13,3.5C13.73,2.67 14.94,2.04 15.94,2C16.07,3.17 15.6,4.35 14.9,5.19C14.21,6.04 13.07,6.7 11.95,6.61C11.8,5.46 12.36,4.26 13,3.5Z" />
                    </svg>
                    <div class="store-text">
                        <div class="store-text-small">Download on</div>
                        <div class="store-text-main">App Store</div>
                    </div>
                </a>
            </div>
        </div>

        <div id="status" class="status"></div>
    </div>

    <script>
        // Get user ID from URL parameters
        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name) ||
                new URLSearchParams(window.location.hash.substr(1)).get(name);
        }

        const userId = getUrlParameter('userId');
        console.log('User ID from URL:', userId);

        // Show status message
        function showStatus(message, type = 'info') {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = `status show ${type}`;

            setTimeout(() => {
                statusEl.className = 'status';
            }, 5000);
        }

        // Try to open the app
        function openApp() {
            if (userId) {
                const deepLink = `later://profile/${userId}`;
                console.log('Attempting to open:', deepLink);

                showStatus('Opening Later app...', 'info');

                // Try to open the app
                window.location.href = deepLink;

                // Fallback message after delay
                setTimeout(() => {
                    showStatus('App not installed? Download Later from the buttons above!', 'info');
                }, 2000);
            } else {
                showStatus('Invalid link - missing user information', 'info');
            }
        }

        // Set up the open app button
        document.getElementById('openAppBtn').addEventListener('click', function (e) {
            e.preventDefault();
            openApp();
        });

        // Load user info
        if (userId) {
            // Fetch real user data from Firebase Functions
            fetchUserData(userId);

            // Auto-attempt to open app on mobile devices after a delay
            if (/Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
                setTimeout(() => {
                    console.log('Auto-opening app on mobile device');
                    openApp();
                }, 1500);
            }
        } else {
            document.getElementById('userName').textContent = 'Someone';
            showStatus('This appears to be an invalid link', 'info');
        }

        // Fetch user data from Firebase Functions
        async function fetchUserData(userId) {
            try {
                document.getElementById('userName').textContent = 'Loading...';

                const response = await fetch(`https://us-central1-later-da778.cloudfunctions.net/getUserData?userId=${userId}`);

                if (response.ok) {
                    const userData = await response.json();

                    if (userData.displayName) {
                        document.getElementById('userName').textContent = userData.displayName;
                    } else {
                        document.getElementById('userName').textContent = 'Your friend';
                    }

                    // Update profile picture
                    const avatarEl = document.getElementById('userAvatar');
                    if (userData.photoURL) {
                        avatarEl.innerHTML = `<img src="${userData.photoURL}" alt="Profile" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">`;
                    } else {
                        // Keep the "L" if no photo available
                        avatarEl.textContent = 'L';
                    }
                } else {
                    console.error('Failed to fetch user data:', response.status);
                    document.getElementById('userName').textContent = 'Your friend';
                    showStatus('Could not load user information', 'info');
                }
            } catch (error) {
                console.error('Error fetching user data:', error);
                document.getElementById('userName').textContent = 'Your friend';
                showStatus('Could not load user information', 'info');
            }
        }

        // Handle visibility change (when user returns to page after app attempt)
        document.addEventListener('visibilitychange', function () {
            if (!document.hidden) {
                console.log('User returned to page');
            }
        });
    </script>
</body>

</html>
